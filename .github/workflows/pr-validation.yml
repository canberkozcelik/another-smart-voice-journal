name: PR Validation

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Check code formatting with ktlint
      run: ./gradlew ktlintCheck

    - name: Run lint checks
      run: ./gradlew lint

    - name: Upload lint reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pr-lint-reports
        path: |
          app/build/reports/lint-results.xml
          core/*/build/reports/lint-results.xml
        retention-days: 7

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build and test
      run: ./gradlew build

    - name: Upload build and test reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pr-build-and-test-reports
        path: |
          app/build/reports/
          core/*/build/reports/
          app/build/outputs/androidTest-results/
          core/*/build/outputs/androidTest-results/
          app/build/reports/tests/
          core/*/build/reports/tests/
        retention-days: 7 